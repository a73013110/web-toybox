<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="選擇空檔暗號與活動，完成一張專屬的邀請卡。">
    <title>Invitation Card — Web Toybox</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="aurora" aria-hidden="true"></div>
    <div class="mesh" id="mesh" aria-hidden="true"></div>
    <div class="ambient-dots" id="ambientDots" aria-hidden="true"></div>
    <div class="ambient-shapes" id="ambientShapes" aria-hidden="true">
      <span class="shape shape-ring"></span>
      <span class="shape shape-diamond"></span>
      <span class="shape shape-ring shape-ring-small"></span>
      <span class="shape shape-line"></span>
      <span class="shape shape-diamond shape-diamond-small"></span>
      <span class="shape shape-arc"></span>
    </div>

    <a class="back-link" href="../../" aria-label="回到作品目錄">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
      <span>作品目錄</span>
    </a>

    <div class="name-gate" id="nameGate" role="dialog" aria-modal="true" aria-labelledby="nameGateTitle" hidden>
      <form class="name-panel" id="nameForm" novalidate>
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 34 34" fill="none">
            <rect x="4" y="4" width="26" height="26"/>
            <rect x="9" y="9" width="16" height="16" transform="rotate(45 17 17)"/>
          </svg>
        </div>
        <p class="eyebrow">Before We Begin</p>
        <h2 id="nameGateTitle">該怎麼稱呼你？</h2>
        <p class="sub">填入姓名或喜歡的稱呼，再打開這張邀請卡。</p>
        <label class="name-label" for="inviteeName">姓名或稱呼</label>
        <input class="name-input" id="inviteeName" name="inviteeName" type="text" maxlength="40" autocomplete="name" aria-describedby="nameError" required>
        <p class="field-error" id="nameError" aria-live="polite"></p>
        <button class="btn btn-primary btn-wide" type="submit">開始</button>
      </form>
    </div>

    <main class="stage">
      <article class="card" id="card" aria-label="邀請卡互動流程">
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        <button class="step-back" id="previousBtn" type="button" hidden aria-label="回到上一步">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>
          <span>上一步</span>
        </button>

        <section class="scene active" id="scene1" data-step="1" aria-labelledby="scene1Title">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 34 34" fill="none">
              <rect x="4" y="4" width="26" height="26"/>
              <rect x="9" y="9" width="16" height="16" transform="rotate(45 17 17)"/>
            </svg>
          </div>
          <p class="eyebrow">Private Invitation</p>
          <h1 id="scene1Title"><span class="invitee-name" id="inviteeNameLabel" hidden></span>你願意跟我<br>出去嗎？</h1>
          <p class="sub"><span class="sub-inner" id="subText" aria-live="polite">誠摯邀請，共度一段時光</span></p>
          <div class="divider" aria-hidden="true"></div>
          <div class="button-stack">
            <button class="btn btn-primary" id="yesBtn" type="button">願意</button>
            <button class="btn btn-link" id="noBtn" type="button" aria-describedby="subText">先不要</button>
          </div>
        </section>

        <section class="scene" id="scene2" data-step="2" aria-labelledby="scene2Title" hidden>
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 34 34" fill="none">
              <circle cx="17" cy="17" r="15"/>
              <path class="mark-ink" d="M11 17l4 4 8-8"/>
            </svg>
          </div>
          <p class="eyebrow">Confirmed</p>
          <h2 id="scene2Title">太好了</h2>
          <p class="sub">太好了，拒絕按鈕也鬆了一口氣</p>
          <div class="divider" aria-hidden="true"></div>
          <button class="btn btn-primary btn-wide" id="toScene3" type="button">繼續</button>
        </section>

        <section class="scene" id="scene3" data-step="3" aria-labelledby="scene3Title" hidden>
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 34 34" fill="none">
              <circle class="mark-ink" cx="17" cy="17" r="14"/>
              <path class="mark-ink" d="M17 9v8l5 3M25.5 8.5l2-2"/>
            </svg>
          </div>
          <p class="eyebrow">Step One</p>
          <h2 id="scene3Title">空檔暗號</h2>
          <p class="sub">等兩個大忙人同時逃出行程表</p>

          <form id="timingForm" novalidate>
            <fieldset class="timing-fieldset">
              <legend class="sr-only">選擇成行方式</legend>
              <div class="timing-grid">
                <label class="timing-option">
                  <input type="radio" name="timing" value="突然有空就走">
                  <span class="timing-card"><b>01</b><span><strong>突然有空就走</strong><small>不問原因，先離開工作現場。</small></span></span>
                </label>
                <label class="timing-option">
                  <input type="radio" name="timing" value="提前三天通知">
                  <span class="timing-card"><b>02</b><span><strong>提前三天通知</strong><small>給行事曆一點心理準備。</small></span></span>
                </label>
                <label class="timing-option">
                  <input type="radio" name="timing" value="深夜限定">
                  <span class="timing-card"><b>03</b><span><strong>深夜限定</strong><small>白天屬於生活，晚上才屬於我們。</small></span></span>
                </label>
                <label class="timing-option">
                  <input type="radio" name="timing" value="看到訊息再說">
                  <span class="timing-card"><b>04</b><span><strong>看到訊息再說</strong><small>一切取決於當時的電量。</small></span></span>
                </label>
                <label class="timing-option">
                  <input type="radio" name="timing" value="交給命運安排">
                  <span class="timing-card"><b>05</b><span><strong>交給命運安排</strong><small>同時有空的那天，就是黃道吉日。</small></span></span>
                </label>
              </div>
            </fieldset>
            <p class="field-error" id="timingError" aria-live="polite"></p>
            <button class="btn btn-primary btn-wide" id="toScene4" type="submit" disabled>繼續</button>
          </form>
        </section>

        <section class="scene" id="scene4" data-step="4" aria-labelledby="scene4Title" hidden>
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 34 34" fill="none">
              <circle class="mark-ink" cx="17" cy="17" r="14"/>
              <path class="mark-ink" d="M17 9v8l6 3"/>
            </svg>
          </div>
          <p class="eyebrow">Step Two</p>
          <h2 id="scene4Title">選擇項目</h2>
          <p class="sub">可以複選，多挑幾件想一起做的事</p>

          <form id="activityForm" novalidate>
            <fieldset class="activity-fieldset">
              <legend class="sr-only">選擇一項或多項活動</legend>
              <div class="activity-grid">
                <label class="activity-option">
                  <input type="checkbox" name="activities" value="用餐">
                  <span class="option-card">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v6a2 2 0 0 0 2 2v12M7 2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2M17 2c-2 0-3 2-3 5v3c0 1.5 1 2 2 2v10"/></svg>
                    <span class="option-copy"><b>用餐</b><small>先研究菜單，最後還是點招牌。</small></span>
                  </span>
                </label>
                <label class="activity-option">
                  <input type="checkbox" name="activities" value="散步">
                  <span class="option-card">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0ZM10 9l-2 5-4 2M10 9l4 3 4-1M8 14l3 2-1 6M11 16l4 6"/></svg>
                    <span class="option-copy"><b>散步</b><small>走著走著，也許就不想回家。</small></span>
                  </span>
                </label>
                <label class="activity-option">
                  <input type="checkbox" name="activities" value="由妳安排">
                  <span class="option-card">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
                    <span class="option-copy"><b>由妳安排</b><small>我負責準時出現，驚喜交給妳。</small></span>
                  </span>
                </label>
                <label class="activity-option">
                  <input type="checkbox" name="activities" value="深夜暢談">
                  <span class="option-card">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/><path d="M9 12h.01M13 12h.01M17 12h.01"/></svg>
                    <span class="option-copy"><b>深夜暢談</b><small>手機翻面，聊到城市慢慢安靜。</small></span>
                  </span>
                </label>
                <label class="activity-option">
                  <input type="checkbox" name="activities" value="交換心事">
                  <span class="option-card">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
                    <span class="option-copy"><b>交換心事</b><small>一人一個秘密，先從不尷尬的開始。</small></span>
                  </span>
                </label>
                <label class="activity-option">
                  <input type="checkbox" name="activities" value="未來藍圖">
                  <span class="option-card">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/><path d="M17 4h4v4"/></svg>
                    <span class="option-copy"><b>未來藍圖</b><small>不急著定答案，先把想像攤開聊。</small></span>
                  </span>
                </label>
                <div class="activity-option custom-activity-option">
                  <input id="customActivityToggle" type="checkbox" name="activities" value="__custom__">
                  <label class="option-card" for="customActivityToggle">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
                    <span class="option-copy"><b>自己填寫</b><small>把你真正想做的事加進來。</small></span>
                  </label>
                  <label class="sr-only" for="customActivityInput">自訂活動</label>
                  <input class="custom-activity-input" id="customActivityInput" type="text" maxlength="50" placeholder="例如：一起看展" autocomplete="off">
                </div>
              </div>
            </fieldset>
            <div class="selection-status">
              <p id="selectionCount" aria-live="polite">尚未選擇</p>
              <p class="field-error" id="activityError" aria-live="polite"></p>
            </div>
            <button class="btn btn-primary btn-wide" id="toScene5" type="submit" disabled>確認選擇</button>
          </form>
        </section>

        <section class="scene" id="scene5" data-step="5" aria-labelledby="scene5Title" hidden>
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 34 34" fill="none">
              <rect x="4" y="4" width="26" height="26"/>
              <rect x="9" y="9" width="16" height="16" transform="rotate(45 17 17)"/>
            </svg>
          </div>
          <p class="eyebrow">All Set</p>
          <h2 id="scene5Title">行程已安排</h2>
          <dl class="summary-box">
            <div class="summary-row"><dt>時間</dt><dd id="summaryTiming">—</dd></div>
            <div class="summary-row"><dt>項目</dt><dd id="summaryActivity">—</dd></div>
          </dl>
          <p class="friendly-clause">友情提醒：臨時放鳥，罰請一杯飲料。</p>
          <button class="btn btn-primary btn-wide" id="restartBtn" type="button">重新開始</button>
        </section>
      </article>

      <footer class="page-footer"><span>Invitation Demo</span><span id="stepLabel">01 / 05</span></footer>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
