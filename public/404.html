<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>找不到頁面 — Web Toybox</title>
    <!--
      404 頁會在「被請求的網址」下渲染，相對路徑會指向錯誤位置，
      因此樣式一律內嵌，圖示與連結則以 JavaScript 推算正確的站台根目錄。
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        color: #141414;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'PingFang TC',
          sans-serif;
        text-align: center;
        background: linear-gradient(180deg, #f7f5f1, #eeece7);
      }
      .code {
        margin: 0;
        color: rgba(168, 135, 79, 0.28);
        font-family: 'Cormorant Garamond', 'Times New Roman', serif;
        font-size: clamp(7rem, 26vw, 15rem);
        font-weight: 500;
        line-height: 0.8;
        letter-spacing: -0.05em;
      }
      .eyebrow {
        margin: 28px 0 12px;
        color: #a8874f;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 14px;
        font-family: 'Cormorant Garamond', 'Times New Roman', serif;
        font-size: 32px;
        font-weight: 600;
      }
      p.sub {
        margin: 0 0 32px;
        color: #74716c;
        font-size: 13px;
        line-height: 1.8;
      }
      .btn {
        display: inline-block;
        min-width: 220px;
        padding: 15px 34px;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        background: #141414;
        border-radius: 2px;
        box-shadow: 0 10px 24px rgba(20, 20, 20, 0.2);
        transition: background 200ms ease;
      }
      .btn:hover {
        background: #a8874f;
      }
      .btn:focus-visible {
        outline: 3px solid #a8874f;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <p class="eyebrow">Not Found</p>
      <h1>這個玩具不在箱子裡</h1>
      <p class="sub">網址可能打錯了，或這件作品已經搬家。</p>
      <a class="btn" id="homeLink" href="/">回到作品目錄</a>
    </main>

    <script>
      // GitHub Pages 專案站台的網址是 /<repo>/...，需保留第一段路徑才能回到首頁。
      (function () {
        const segments = location.pathname.split('/').filter(Boolean);
        const isProjectPage = location.hostname.endsWith('github.io') && segments.length > 0;
        document.getElementById('homeLink').href = isProjectPage ? `/${segments[0]}/` : '/';
      })();
    </script>
  </body>
</html>
